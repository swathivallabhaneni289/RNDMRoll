<title>{{if .Username}}Join @{{.Username}} on RNDMRoll{{else}}RNDMRoll{{end}}</title>

<link rel="preload" href="/i/assets/WorkSans_400Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* The app's own fonts (@expo-google-fonts), only the weights this page uses. */
  @font-face { font-family: "Domine"; font-weight: 600; font-style: normal; font-display: swap; src: url("/i/assets/Domine_600SemiBold.ttf") format("truetype"); }
  @font-face { font-family: "Work Sans"; font-weight: 400; font-style: normal; font-display: swap; src: url("/i/assets/WorkSans_400Regular.ttf") format("truetype"); }
  @font-face { font-family: "Work Sans"; font-weight: 600; font-style: normal; font-display: swap; src: url("/i/assets/WorkSans_600SemiBold.ttf") format("truetype"); }

  /* lib/theme/tokens.ts */
  :root {
    --page: #F6F5F2;      /* dominant */
    --secondary: #E8E7E3;
    --ink: #111111;
    --muted: #625F5B;
    --serif: "Domine", Georgia, "Times New Roman", serif;
    --sans: "Work Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --ease-out: cubic-bezier(0.33, 1, 0.68, 1);   /* Easing.out(Easing.cubic) */
    --spin-ease: cubic-bezier(0.25, 0, 0, 1);     /* SpinningMark's SPIN_EASING */
    --sine: cubic-bezier(0.37, 0, 0.63, 1);       /* Easing.inOut(Easing.sin) */
    /* The width the background's sizes are fractions of: the screen's, but never wider than a tall phone's on a wide screen. */
    --bw: min(100vw, 75vh);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); }
  body { color: var(--ink); font: 400 16px/24px var(--sans); -webkit-text-size-adjust: 100%; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }

  /* ---- The Welcome background (components/brand/WheelBackground.tsx) ---- */
  .bg { position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; pointer-events: none; z-index: 0; -webkit-user-select: none; user-select: none; }
  .bg svg { display: block; overflow: visible; }
  .ghost, .orbit { position: absolute; }
  .ghost > div, .ghost svg { width: 100%; height: 100%; }
  .ghost * { vector-effect: non-scaling-stroke; }
  /* Two oversized ghost wheels off opposite corners, turning opposite ways (45 s and 60 s). */
  .g1 { left: calc(4% - 0.33 * var(--bw)); top: calc(18.5% - 0.33 * var(--bw)); width: calc(0.66 * var(--bw)); height: calc(0.66 * var(--bw)); transform: rotate(12deg); animation: turn-g1 45s linear infinite; }
  .g2 { left: calc(102% - 0.31 * var(--bw)); top: calc(97.5% - 0.31 * var(--bw)); width: calc(0.62 * var(--bw)); height: calc(0.62 * var(--bw)); transform: rotate(-28deg); animation: turn-g2 60s linear infinite; }
  @keyframes turn-g1 { from { transform: rotate(12deg); } to { transform: rotate(372deg); } }
  @keyframes turn-g2 { from { transform: rotate(-28deg); } to { transform: rotate(-388deg); } }
  /* While the main wheel spins they spin up 300 degrees more, then settle back to their drift. */
  .g1 > div { animation: kick-cw 2800ms var(--spin-ease) both; }
  .g2 > div { animation: kick-ccw 2800ms var(--spin-ease) both; }
  @keyframes kick-cw { from { transform: rotate(0deg); } to { transform: rotate(300deg); } }
  @keyframes kick-ccw { from { transform: rotate(0deg); } to { transform: rotate(-300deg); } }
  /* A dashed arc: a big circle centred off the right edge, turning so the dashes orbit (80 s). */
  .orbit { left: calc(109% - 0.3 * var(--bw)); top: calc(60% - 0.3 * var(--bw)); width: calc(0.6 * var(--bw)); height: calc(0.6 * var(--bw)); animation: orbit 80s linear infinite; }
  .orbit svg { width: 100%; height: 100%; }
  @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  /* The specks float up a little and breathe, as one layer (7 s each way). */
  .specks { position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0.7; animation: breathe 7s var(--sine) infinite alternate; }
  .specks svg { width: 100%; height: 100%; }
  .specks circle { fill: var(--ink); }
  @keyframes breathe { from { opacity: 0.7; transform: translateY(0); } to { opacity: 1; transform: translateY(-14px); } }
  /* The categories at the edges; the one the wheel lands on lights up. */
  .label { position: absolute; display: flex; align-items: center; font: 400 10px/12px var(--sans); letter-spacing: 3px; color: var(--ink); white-space: nowrap; }
  .label span { opacity: 0.38; }
  .label i { display: block; width: 56px; height: 1px; margin-left: 8px; background: var(--ink); opacity: 0.22; transform: scaleX(0.5); transform-origin: left center; }
  .label.lit span { opacity: 1; animation: lit-word 500ms var(--ease-out) 3050ms both; }
  .label.lit i { opacity: 0.82; transform: none; animation: lit-rule 500ms var(--ease-out) 3050ms both; }
  @keyframes lit-word { from { opacity: 0.38; } }
  @keyframes lit-rule { from { opacity: 0.22; transform: scaleX(0.5); } }

  /* ---- The page ---- */
  .page {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; min-height: 100svh;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 24px) 0 calc(env(safe-area-inset-left, 0px) + 24px);
    /* The bottom quarter is left to the background, so its labels never sit under the words or the button. */
    padding-bottom: max(27vh, calc(env(safe-area-inset-bottom, 0px) + 24px));
    padding-bottom: max(27svh, calc(env(safe-area-inset-bottom, 0px) + 24px));
  }
  /* The Spin page's header: the shutter logo beside the name (components/today/TodayScreen.tsx). */
  .brand { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; animation: rise 500ms var(--ease-out) 60ms both; }
  .brand svg { display: block; flex: none; }
  .brand span { font: 600 22px/28px var(--serif); }
  .main {
    flex: 1 1 0; min-height: 0; width: 100%; max-width: 400px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    /* The heading's size, and the most room the words and the button can take (a two-line heading).
       The words always get that room, so the wheel sits in the same place on every invite. */
    --fs: clamp(24px, 7vw, 30px);
    --copy: calc(148px + 2.4 * var(--fs));
  }

  /* The Welcome wheel (components/brand/SpinningMark.tsx): a square box, the disc at 8% across and 16% down, sized 84%.
     As wide as on Welcome (260 on a 402-wide phone), but never so big the words would not fit above the labels. */
  .wheel {
    --s: min(64.68vw, 320px, max(150px, calc(73vh - 60px - var(--copy))));
    position: relative; flex: none; width: var(--s); height: var(--s);
    animation: reveal 600ms var(--ease-out) 120ms both;
  }
  @supports (height: 1svh) {
    .wheel { --s: min(64.68vw, 320px, max(150px, calc(73svh - 60px - var(--copy)))); }
  }
  @supports (container-type: size) {
    .main { container-type: size; }
    .wheel { --s: min(64.68vw, 320px, max(150px, calc(100cqh - 8px - var(--copy)))); }
  }
  .wheel svg { display: block; position: absolute; width: 100%; height: 100%; }
  .disc { position: absolute; left: 8%; top: 16%; width: 84%; height: 84%; animation: spin 2600ms var(--spin-ease) 350ms both; }
  .disc svg { position: static; }
  .on-light { color: var(--ink); }
  .on-dark { color: var(--page); }
  /* One and a bit turns, so it stops exactly in the logo pose. */
  @keyframes spin { from { transform: rotate(-504deg); } to { transform: rotate(0deg); } }
  @keyframes reveal { from { opacity: 0; transform: scale(0.97); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .copy { flex: none; width: 100%; min-height: var(--copy); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .copy-top { width: 100%; animation: rise 500ms var(--ease-out) 260ms both; }
  .copy-bottom { width: 100%; animation: rise 500ms var(--ease-out) 360ms both; }
  h1 { margin: 16px 0 0; font: 600 var(--fs)/1.2 var(--serif); text-wrap: balance; overflow-wrap: anywhere; }
  .tagline { margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--muted); }
  .button {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 44px; margin-top: 28px; padding: 10px 16px;
    background: var(--ink); color: var(--page); border-radius: 8px; text-decoration: none;
    font: 600 16px/24px var(--sans); box-shadow: 0 4px 20px rgba(17, 17, 17, 0.18);
    transition: transform 90ms var(--ease-out); -webkit-tap-highlight-color: transparent;
  }
  .button:active { transform: scale(0.97); }
  .button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .soon { margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--muted); }
  .copy-bottom > .soon:first-child { margin-top: 24px; }

  /* A phone on its side: no room for the labels or the quarter kept for them. */
  @media (max-height: 520px) {
    .page { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
    .main { flex: none; container-type: normal; padding: 16px 0; }
    .wheel, .main .wheel { --s: 180px; }
    .copy { min-height: 0; }
    .label { display: none; }
  }
  /* Reduce Motion: everything stands still, as it looks once the wheel has landed. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

  <main class="main">

          <circle r="0.05" fill="#111111"/>

          <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

        <polygon points="-0.0460,-1.0919 0.0460,-1.0919 0,-0.9988" fill="#F6F5F2" stroke="#F6F5F2" stroke-width="0.06095" stroke-linejoin="round"/>

    <div class="copy">
      <div class="copy-top">
        <h1>{{if .Username}}@{{.Username}} invited you.{{else}}You're invited.{{end}}</h1>
        <p class="tagline">one spin. one real moment.</p>
      </div>
      <div class="copy-bottom">
        {{- if .Username}}
        <a class="button" href="{{.OpenURL}}">Open in RNDMRoll</a>
        {{- end}}
        <p class="soon">Coming soon to the App Store.</p>
      </div>
    </div>
  </main>
</div>
</body>
</html>
